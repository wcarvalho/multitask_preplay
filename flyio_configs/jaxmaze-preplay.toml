# fly.toml app configuration file generated for jaxmaze-preplay on 2025-08-20T17:29:00-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jaxmaze-preplay'
primary_region = 'bos'

[build]
  dockerfile = 'Dockerfile_jaxmaze'

[env]
  MAN = 'paths'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-4x'

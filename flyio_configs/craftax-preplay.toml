# fly.toml app configuration file generated for craftax-preplay on 2025-08-20T17:53:35-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'craftax-preplay'
primary_region = 'bos'

[build]
  dockerfile = 'Dockerfile_craftax'

[env]
  SAY_REUSE = '0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'performance-8x'

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multitask-preplay"
version = "0.1.0"
description = "Research code for multitask preplay experiments"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "google-cloud-storage",
    "python-dotenv",
    "scikit-image",
    "polars", 
    "joblib",
    "safetensors",
    "ipywidgets",
    "aiofiles",
    "statsmodels",
    "craftax",
    "playwright",
    "jupyterlab",
    "matplotlib",
    "seaborn", 
    "tqdm",
    "nicegui",
    "jax",
    "jaxlib",
    "datasets",
    "huggingface-hub",
    "housemaze @ git+https://github.com/wcarvalho/JaxMaze.git",
    "jaxneurorl @ git+https://github.com/wcarvalho/jaxneurorl.git", 
    "nicewebrl @ git+https://github.com/wcarvalho/nicewebrl.git",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88 